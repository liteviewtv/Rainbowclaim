<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03194f">
<meta name="description" content="RainbowClaim Ethereum reward address generator">
<title>RainbowClaim — Reward Address Generator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;background:#03194f;color:#fff}.page{min-height:100vh;background:linear-gradient(180deg,#06205e 0%,#03194f 55%,#021844 100%);padding:54px 24px 80px}.container{width:min(920px,100%);margin:0 auto}.header{display:flex;align-items:center;gap:28px;margin:0 0 62px 2px}.logo{width:92px;height:92px;flex:0 0 92px;border-radius:18px;overflow:hidden;position:relative;background:#06205e;box-shadow:0 8px 24px rgba(0,0,0,.16)}.logo img{position:absolute;width:148px;height:148px;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%)}.brand h1{margin:0;font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.035em;color:#fff}.card{border:1px solid rgba(148,163,184,.28);border-radius:18px;background:rgba(8,31,83,.58);box-shadow:0 18px 55px rgba(0,0,0,.18);padding:46px 38px 52px}.claim-title{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:28px}.gift{font-size:45px;line-height:1}.claim-title h2{margin:0;font-size:clamp(30px,5vw,44px);line-height:1.1;color:#fff;letter-spacing:-.03em}.intro{text-align:center;max-width:720px;margin:0 auto 68px;color:#cbd5e1;font-size:clamp(18px,3vw,25px);line-height:1.65}label{display:block;margin:0 0 14px 4px;font-size:18px;font-weight:800;color:#f8fafc}.input-wrap{position:relative;width:100%}.input{width:100%;height:74px;border:1px solid rgba(148,163,184,.42);border-radius:14px;background:rgba(1,16,51,.78);color:#fff;outline:none;padding:0 190px 0 24px;font-size:20px;user-select:text;-webkit-user-select:text;caret-color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}.input::placeholder{color:#94a3b8}.input:focus{border-color:#4b76bb;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.paste{position:absolute;right:8px;top:8px;height:58px;min-width:160px;border:0;border-radius:10px;background:#0964df;color:#fff;font-size:18px;font-weight:800;cursor:pointer;transition:transform .15s ease,filter .15s ease;touch-action:manipulation}.paste:hover{transform:translateY(-1px);filter:brightness(1.08)}.actions{display:block;margin-top:28px}.actions button{height:68px;border:0;border-radius:12px;color:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:transform .15s ease,filter .15s ease;touch-action:manipulation}.actions button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.actions button:active:not(:disabled){transform:translateY(0)}.actions button:disabled{opacity:.65;cursor:wait}.generate{width:100%;background:#12b957}.result-heading{display:flex;align-items:center;gap:28px;margin:70px 0 26px;color:#b8c1d0;font-size:26px;font-weight:700;text-align:center}.result-heading:before,.result-heading:after{content:"";height:1px;background:rgba(148,163,184,.38);flex:1}.result-box{min-height:190px;border:1px solid rgba(148,163,184,.3);border-radius:14px;background:rgba(1,16,51,.58);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px}.reward{width:100%;text-align:center;overflow-wrap:anywhere;font-size:17px;line-height:1.55;color:#f8fafc;min-height:27px}.copy{width:auto;min-width:240px;height:62px;margin-top:22px;background:transparent;border:2px solid #12b957;color:#12e968;font-size:20px}.error{margin:16px 0 0;color:#fda4af;font-size:15px;text-align:center}.footer{text-align:center;color:#cbd5e1;font-size:21px;line-height:1.9;margin-top:48px}.footer strong{display:block;font-weight:500}.footer .luck{margin-top:10px}@media(max-width:640px){.page{padding:28px 16px 55px}.header{gap:16px;margin-bottom:34px}.logo{width:76px;height:76px;flex-basis:76px;border-radius:14px}.logo img{width:122px;height:122px}.brand h1{font-size:31px}.card{padding:34px 20px 38px;border-radius:16px}.claim-title{gap:10px;margin-bottom:20px}.gift{font-size:34px}.claim-title h2{font-size:30px}.intro{font-size:17px;margin-bottom:44px}.input{height:62px;font-size:16px;padding:0 135px 0 17px}.paste{right:6px;top:6px;height:50px;min-width:112px;font-size:16px}.actions{margin-top:14px}.actions button{height:58px;font-size:16px}label{font-size:15px}.result-heading{font-size:20px;gap:14px;margin-top:48px}.result-box{min-height:170px}.copy{min-width:190px;height:54px;font-size:16px}.footer{font-size:16px;margin-top:34px}}@media(max-width:390px){.header{align-items:flex-start}.logo{width:64px;height:64px;flex-basis:64px}.logo img{width:102px;height:102px}.brand h1{font-size:27px}.input{padding-right:115px}.paste{min-width:96px;font-size:15px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page"><div class="container">
<header class="header"><div class="logo" aria-label="RainbowClaim logo"><img src="/public/background.jpg?v=2" alt="RainbowClaim logo"></div><div class="brand"><h1>RainbowClaim</h1></div></header>
<section class="card">
<div class="claim-title"><span class="gift" aria-hidden="true">🎁</span><h2>Claim Your Reward</h2></div>
<p class="intro">Enter your Ethereum wallet address below and<br class="desktop-break"> get a random reward address instantly.</p>
<form id="form"><label for="wallet">Your Ethereum Wallet Address</label><div class="input-wrap"><input class="input" id="wallet" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="0x..." aria-label="Your Ethereum Wallet Address"><button id="paste" class="paste" type="button">▣ &nbsp; Paste</button></div><div class="actions"><button id="generate" class="generate" type="submit">🎁 &nbsp; Get Random Reward</button></div><p id="error" class="error" role="alert"></p></form>
<div class="result-heading">Your Reward Address</div><div class="result-box"><div id="reward" class="reward" aria-live="polite"></div><button id="copy" class="copy" type="button">▣ &nbsp; Copy Address</button></div><div class="footer"><strong>Rewards are distributed randomly.</strong><strong class="luck">Good luck! 🍀</strong></div>
</section></div></main>
<script>
const form=document.getElementById('form'),wallet=document.getElementById('wallet'),paste=document.getElementById('paste'),generate=document.getElementById('generate'),copy=document.getElementById('copy'),reward=document.getElementById('reward'),error=document.getElementById('error');
paste.addEventListener('click',async()=>{error.textContent='';try{const text=await navigator.clipboard.readText();wallet.focus();wallet.value=text.trim()}catch{error.textContent='Tap and hold the address box and choose Paste, or allow clipboard access in your browser.'}});
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';reward.textContent='';const value=wallet.value.trim();if(!/^0x[a-fA-F0-9]{40}$/.test(value)){error.textContent='Please enter a valid Ethereum wallet address.';return}generate.disabled=true;generate.textContent='Generating...';try{const response=await fetch('/generate-reward',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({walletAddress:value})});const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`Reward service returned an invalid response (${response.status}).`)}if(!response.ok)throw new Error(data.error||'Unable to generate a reward address.');if(!data.rewardAddress)throw new Error('Reward service returned no reward address.');reward.textContent=data.rewardAddress}catch(err){error.textContent=err.message||'Unable to generate a reward address. Please try again.'}finally{generate.disabled=false;generate.textContent='🎁  Get Random Reward'}});
copy.addEventListener('click',async()=>{if(!reward.textContent){error.textContent='Generate a reward address first.';return}try{await navigator.clipboard.writeText(reward.textContent);copy.textContent='✓  Copied!';setTimeout(()=>copy.textContent='▣  Copy Address',1800)}catch{error.textContent='Unable to copy the reward address. Please copy it manually.'}});
</script>
<style>#demo-notification{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;width:min(92vw,520px);padding:12px 18px;border-radius:12px;background:#12b957;border:1px solid rgba(255,255,255,.32);box-shadow:0 10px 30px rgba(0,0,0,.3);color:#fff;text-align:center;font-size:15px;font-weight:700;opacity:0;transition:opacity .35s ease,transform .35s ease;pointer-events:none}#demo-notification.show{opacity:1;transform:translateX(-50%) translateY(0)}</style>
<div id="demo-notification" aria-live="polite"></div>
<script>(()=>{const notification=document.getElementById("demo-notification");const users=["0x39***582","0x7A***914","0xB2***306","0x4F***771","0x91***428","0xD8***653","0x26***845","0x63***219"];function randomAmount(){return Math.floor(Math.random()*(10000-1000+1))+1000}function showDemoNotification(){const user=users[Math.floor(Math.random()*users.length)],amount=randomAmount().toLocaleString("en-US");notification.textContent=`${user} successfully claimed $${amount}`;notification.classList.add("show");setTimeout(()=>notification.classList.remove("show"),3500)}showDemoNotification();setInterval(showDemoNotification,5000)})();</script>
</body></html>
